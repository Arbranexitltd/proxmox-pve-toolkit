[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proxmox-pve-toolkit"
version = "1.0.0"
authors = [
  { name = "Principal Infrastructure Team", email = "devops@infra.enterprise" },
]
description = "Enterprise-grade Python CLI toolkit for Proxmox VE 7.x/8.x hypervisor auditing, automated backups, bulk power orchestration, and security baseline hardening."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Clustering",
]
dependencies = [
    "typer[all]>=0.15.0",
    "rich>=13.9.0",
    "proxmoxer>=2.2.0",
    "requests>=2.32.0",
    "urllib3>=2.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
pve-tool = "proxmox_pve_toolkit.main:app"
proxmox-toolkit = "proxmox_pve_toolkit.main:app"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
